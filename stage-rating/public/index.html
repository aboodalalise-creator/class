<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قيّم المحاضرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:#7A1634; --ink:#1E1620; --paper:#FBF9FB; --mist:#EDE7EE; --line:#D9CFDB; --gold:#E3A71F;
    --font:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    font-family:var(--font); color:var(--ink); background:var(--paper);
    display:flex; flex-direction:column; min-height:100dvh;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .top{
    background:var(--maroon); color:#fff;
    padding:12vh 24px 64px; text-align:right;
  }
  .top h1{font-size:clamp(1.7rem,7vw,2.4rem); font-weight:700; line-height:1.35}
  .top p{margin-top:10px; font-weight:300; opacity:.85; font-size:1rem}
  .sheet{
    flex:1; background:var(--paper); margin-top:-32px; border-radius:28px 28px 0 0;
    padding:36px 20px 28px; display:flex; flex-direction:column; gap:20px; align-items:center;
  }
  .stars{display:flex; gap:clamp(6px,2vw,12px); width:100%; max-width:440px; justify-content:center}
  .star{
    appearance:none; border:0; background:transparent; padding:0; cursor:pointer;
    width:clamp(52px,16vw,76px); aspect-ratio:1; display:grid; place-items:center;
    -webkit-tap-highlight-color:transparent; border-radius:14px;
  }
  .star:focus-visible{outline:3px solid var(--maroon); outline-offset:3px}
  .star svg{width:100%; height:100%; fill:var(--mist); stroke:var(--line); stroke-width:1; transition:fill .15s, stroke .15s}
  .star.on svg{fill:var(--gold); stroke:#B98410}
  .star.pop svg{animation:pop .22s ease-out}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.22)}100%{transform:scale(1)}}
  .ends{display:flex; justify-content:space-between; width:100%; max-width:440px; font-size:.9rem; color:#6b5f6e; padding:0 6px}
  .likes{display:flex; gap:16px; width:100%; max-width:440px}
  .lk{
    flex:1; appearance:none; font:inherit; cursor:pointer; border:2px solid var(--line); background:#fff;
    border-radius:22px; padding:22px 8px 16px; display:flex; flex-direction:column; align-items:center; gap:8px;
    font-size:1.15rem; font-weight:600; color:var(--ink); -webkit-tap-highlight-color:transparent;
    transition:background .15s, border-color .15s, color .15s;
  }
  .lk svg{width:clamp(56px,18vw,84px); height:auto; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linejoin:round; stroke-linecap:round}
  .lk.up.on{background:#1F7A4D; border-color:#1F7A4D; color:#fff}
  .lk.down.on{background:var(--maroon); border-color:var(--maroon); color:#fff}
  .lk:focus-visible{outline:3px solid var(--maroon); outline-offset:3px}
  .lk.pop svg{animation:pop .22s ease-out}
  [hidden]{display:none!important}
  .status{min-height:3.2em; text-align:center; font-size:1.05rem; line-height:1.7; max-width:30ch}
  .status.err{color:#B00020}
  @media (prefers-reduced-motion:reduce){.star.pop svg,.lk.pop svg{animation:none}}
</style>
</head>
<body>
  <header class="top">
    <h1 id="title">قيّم المحاضرة</h1>
    <p id="hint">اختر عدد النجوم من 1 إلى 5</p>
  </header>
  <main class="sheet">
    <div class="stars" id="stars" role="radiogroup" aria-label="التقييم من 1 إلى 5"></div>
    <div class="ends" id="ends"><span>ضعيف</span><span>ممتاز</span></div>
    <div class="likes" id="likes" role="group" aria-label="رأيك" hidden></div>
    <p class="status" id="status" aria-live="polite">اضغط على النجمة المناسبة.</p>
  </main>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var q=new URLSearchParams(location.search);
  var S=((q.get('s')||'main').toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,32))||'main';
  var T=(q.get('t')||'').slice(0,80);
  var LIKE=q.get('m')==='like'; // like mode stores 5 = like, 1 = dislike
  if(T){ $('#title').textContent=T; document.title=T; }

  function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null } }
  var id=store('rate-dev');
  if(!id){
    id=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now().toString(36)+Math.random().toString(36).slice(2)+'xxxx');
    store('rate-dev',id);
  }
  var cur=Number(store('rate-v-'+S))||0;

  var STAR='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z" stroke-linejoin="round"/></svg>';
  var THUMB='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10v11H3V10zM7 10l4-8c1.7 0 2.8 1.3 2.5 3L13 9h6a2 2 0 0 1 2 2.3l-1.4 7.8A2 2 0 0 1 17.6 21H7"/></svg>';
  var box=$('#stars'), btns=[];
  if(LIKE){
    box.hidden=true; $('#ends').hidden=true; $('#likes').hidden=false;
    $('#hint').textContent='عجبك ولا لا؟';
    status('اضغط على اختيارك.');
    [[5,'up','عجبني'],[1,'down','ما عجبني']].forEach(function(o){
      var b=document.createElement('button');
      b.type='button'; b.className='lk '+o[1]; b.setAttribute('aria-pressed','false');
      b.innerHTML=(o[1]==='down'?THUMB.replace('<svg','<svg style="transform:rotate(180deg)"'):THUMB)+'<span>'+o[2]+'</span>';
      b.dataset.v=o[0];
      b.addEventListener('click',function(){ send(o[0],b); });
      $('#likes').appendChild(b); btns.push(b);
    });
  }
  else for(var i=1;i<=5;i++){
    (function(n){
      var b=document.createElement('button');
      b.type='button'; b.className='star'; b.setAttribute('role','radio'); b.setAttribute('aria-label',n+' من 5');
      b.innerHTML=STAR;
      b.addEventListener('click',function(){ send(n,b); });
      box.appendChild(b); btns.push(b);
    })(i);
  }
  function word(n){ return LIKE?(n===5?'عجبني 👍':'ما عجبني 👎'):(n+' من 5'); }
  function paint(){
    if(LIKE) return btns.forEach(function(b){ var on=Number(b.dataset.v)===cur; b.classList.toggle('on',on); b.setAttribute('aria-pressed',String(on)); });
    btns.forEach(function(b,idx){
      var on=idx<cur; b.classList.toggle('on',on); b.setAttribute('aria-checked',String(idx===cur-1));
    });
  }
  function status(t,err){ var s=$('#status'); s.textContent=t; s.classList.toggle('err',!!err); }
  if(LIKE&&cur!==1&&cur!==5) cur=0;
  paint();
  if(cur) status('تقييمك الحالي: '+word(cur)+'. تقدر تغيّره في أي وقت.');

  function send(n,btn){
    var prev=cur; cur=n; paint();
    btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');
    status('جاري الإرسال…');
    fetch('/api/vote',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({s:S,id:id,stars:n})})
      .then(function(r){ if(!r.ok) throw new Error('bad'); store('rate-v-'+S,String(n)); status('وصل تقييمك: '+word(n)+'. شكرًا لك، وتقدر تغيّره في أي وقت.'); })
      .catch(function(){ cur=prev; paint(); status('ما وصل التقييم. تأكد من الاتصال وجرّب مرة ثانية.',true); });
  }
})();
</script>
</body>
</html>
