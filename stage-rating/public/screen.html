<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نتائج التقييم المباشرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:#7A1634; --ink:#1E1620; --paper:#FBF9FB; --mist:#EDE7EE; --line:#D9CFDB; --gold:#E3A71F;
    --font:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
    --s:clamp(34px,5.2vw,78px); /* star size */
  }
  *{box-sizing:border-box;margin:0}
  body{font-family:var(--font); color:var(--ink); background:var(--paper); min-height:100dvh}
  .stage{
    min-height:100dvh; padding:clamp(20px,3.4vw,56px);
    display:grid; gap:clamp(20px,3vw,48px);
    grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) auto;
    grid-template-areas:"head head head" "score bars join";
    align-items:center; grid-template-rows:auto 1fr;
  }
  header{grid-area:head; border-inline-start:8px solid var(--maroon); padding-inline-start:20px}
  h1{font-size:clamp(1.8rem,4.2vw,4rem); font-weight:700; color:var(--maroon); line-height:1.25}
  .sub{margin-top:6px; font-size:clamp(1rem,1.6vw,1.6rem); font-weight:300; color:#5d5160}

  .score{grid-area:score; display:flex; flex-direction:column; gap:14px; align-items:flex-start}
  .avg{font-size:clamp(6rem,15vw,17rem); line-height:.95; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
  .avg small{font-size:.28em; font-weight:300; color:#6b5f6e; letter-spacing:0; margin-inline-start:.2em}
  .starrow{position:relative; width:calc(var(--s)*5); height:var(--s); direction:rtl}
  .starrow .layer{position:absolute; inset-block:0; inset-inline-start:0; display:flex; white-space:nowrap; overflow:hidden}
  .starrow svg{flex:none; width:var(--s); height:var(--s)}
  .starrow .base svg{fill:var(--mist); stroke:var(--line)}
  .starrow .fill{width:0; transition:width .6s ease}
  .starrow .fill svg{fill:var(--gold); stroke:#B98410}
  .starrow .base{width:100%}
  .count{font-size:clamp(1.1rem,1.9vw,2rem); font-weight:400; color:#4a3f4d}

  .bars{grid-area:bars; display:flex; flex-direction:column; gap:clamp(10px,1.6vw,22px)}
  .row{display:grid; grid-template-columns:3.2em 1fr 6.5em; align-items:center; gap:14px; font-size:clamp(1rem,1.9vw,2rem)}
  .row .lbl{font-weight:600; font-variant-numeric:tabular-nums; display:flex; align-items:center; gap:.3em}
  .row .lbl svg{width:.8em;height:.8em;fill:var(--gold);stroke:#B98410}
  .track{height:clamp(18px,2.6vw,38px); background:var(--mist); border-radius:999px; overflow:hidden}
  .bar{height:100%; width:0; background:var(--maroon); border-radius:999px; transition:width .6s ease}
  .row .num{font-variant-numeric:tabular-nums; color:#4a3f4d; text-align:start}

  .join{grid-area:join; display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center;
        background:#fff; border:1px solid var(--line); border-radius:20px; padding:clamp(14px,1.8vw,28px)}
  #qr{width:clamp(160px,20vw,300px); height:clamp(160px,20vw,300px); display:grid; place-items:center}
  #qr img,#qr canvas{width:100%!important;height:100%!important}
  .join p{font-size:clamp(1rem,1.5vw,1.5rem); font-weight:600; max-width:12em; line-height:1.5}
  .url{font-size:.8rem!important; font-weight:300!important; color:#6b5f6e; direction:ltr; word-break:break-all; max-width:18em!important}

  .tools{position:fixed; inset-block-end:10px; inset-inline-end:12px; display:flex; gap:10px; align-items:center; font-size:.8rem; color:#8a7e8d}
  .tools button{font:inherit; color:inherit; background:none; border:1px solid var(--line); border-radius:8px; padding:4px 10px; cursor:pointer}
  .tools button:focus-visible{outline:2px solid var(--maroon)}
  #net{display:none; color:#B00020}

  @media (max-width:900px){
    .stage{grid-template-columns:1fr; grid-template-areas:"head" "score" "bars" "join"}
    .starrow{--s:44px}
  }
  @media (prefers-reduced-motion:reduce){.bar,.starrow .fill{transition:none}}
</style>
</head>
<body>
<main class="stage">
  <header>
    <h1 id="title">قيّم المحاضرة</h1>
    <p class="sub">النتائج تتحدّث مباشرة</p>
  </header>

  <section class="score" aria-live="polite">
    <div class="avg" id="avg">—</div>
    <div class="starrow" aria-hidden="true">
      <div class="layer base" id="base"></div>
      <div class="layer fill" id="fill"></div>
    </div>
    <div class="count" id="count">بانتظار أول تقييم</div>
  </section>

  <section class="bars" id="bars" aria-label="توزيع التقييمات"></section>

  <aside class="join">
    <div id="qr"></div>
    <p>امسح الرمز وقيّم من 1 إلى 5</p>
    <p class="url" id="url"></p>
  </aside>
</main>

<div class="tools">
  <span id="net">انقطع الاتصال، أحاول من جديد…</span>
  <button id="reset" type="button">تصفير النتائج</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var q=new URLSearchParams(location.search);
  var S=((q.get('s')||'main').toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,32))||'main';
  var T=(q.get('t')||'').slice(0,80);
  if(T){ $('#title').textContent=T; document.title=T; }

  var STAR='<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z" stroke-linejoin="round"/></svg>';
  var five=''; for(var i=0;i<5;i++) five+=STAR;
  $('#base').innerHTML=five; $('#fill').innerHTML=five;

  // vote link + QR
  var voteURL=location.origin+'/?s='+encodeURIComponent(S)+(T?'&t='+encodeURIComponent(T):'');
  $('#url').textContent=voteURL.replace(/^https?:\/\//,'');
  function makeQR(){
    if(!window.QRCode){ return setTimeout(makeQR,300); }
    new QRCode($('#qr'),{text:voteURL,width:512,height:512,colorDark:'#1E1620',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
  }
  makeQR();

  // bars
  var barsBox=$('#bars'), barEls=[], numEls=[];
  for(var n=5;n>=1;n--){
    var row=document.createElement('div'); row.className='row';
    row.innerHTML='<div class="lbl">'+n+STAR+'</div><div class="track"><div class="bar"></div></div><div class="num">0</div>';
    barsBox.appendChild(row);
    barEls[n]=row.querySelector('.bar'); numEls[n]=row.querySelector('.num');
  }

  function countText(t){
    if(t===0) return 'بانتظار أول تقييم';
    if(t===1) return 'تقييم واحد';
    if(t===2) return 'تقييمان';
    if(t<=10) return t+' تقييمات';
    return t+' تقييمًا';
  }
  function render(d){
    var t=d.total||0;
    $('#avg').innerHTML=t?(Number(d.avg).toFixed(1)+'<small>/ 5</small>'):'—';
    $('#fill').style.width=t?(d.avg/5*100)+'%':'0%';
    $('#count').textContent=countText(t);
    for(var n=1;n<=5;n++){
      var c=d.counts[n-1]||0, pct=t?Math.round(c/t*100):0;
      barEls[n].style.width=pct+'%';
      numEls[n].textContent=c+' ('+pct+'%)';
    }
  }

  var fails=0;
  function tick(){
    if(document.hidden) return;
    fetch('/api/results?s='+encodeURIComponent(S),{cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('bad'); return r.json(); })
      .then(function(d){ fails=0; $('#net').style.display='none'; render(d); })
      .catch(function(){ if(++fails>=3) $('#net').style.display='inline'; });
  }
  tick(); setInterval(tick,2000);
  document.addEventListener('visibilitychange',tick);

  $('#reset').addEventListener('click',function(){
    var pin=prompt('أدخل رمز المشرف لتصفير النتائج:');
    if(!pin) return;
    fetch('/api/reset',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({s:S,pin:pin})})
      .then(function(r){ if(r.status===403) throw new Error('pin'); if(!r.ok) throw new Error('bad'); tick(); })
      .catch(function(e){ alert(e.message==='pin'?'الرمز غير صحيح، أو لم يتم ضبط رمز المشرف.':'تعذّر التصفير.'); });
  });
})();
</script>
</body>
</html>
